name: Build reVC (Linux Deluxe - Infinity Edition)

on:
  workflow_dispatch:
  push:
    branches: [ miami ]

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libopenal-dev libsndfile1-dev libmpg123-dev libglfw3-dev

    - name: Apply "Infinity" Memory Patch
      shell: python
      run: |
        import os
        import re

        def patch_limits(filepath):
            if not os.path.exists(filepath):
                print(f"Error: {filepath} not found!")
                return
            
            with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                content = f.read()
            
            # --- FIX 1: INCREASE MODEL LIMITS (The Cause of your crash) ---
            # We find the existing number and replace it with a huge one.
            
            # Simple Objects (Buildings): 3885 -> 30000
            content = re.sub(r'NUMSIMPLEMODELINFOS\s*=\s*\d+', 'NUMSIMPLEMODELINFOS = 30000', content)
            
            # Time Objects (Lights/Neons): 385 -> 10000
            content = re.sub(r'NUMTIMEMODELINFOS\s*=\s*\d+', 'NUMTIMEMODELINFOS = 10000', content)
            
            # Weapon Objects: 51 -> 200
            content = re.sub(r'NUMWEAPONMODELINFOS\s*=\s*\d+', 'NUMWEAPONMODELINFOS = 200', content)
            
            # Vehicle Objects: 110 -> 500
            content = re.sub(r'NUMVEHICLEMODELINFOS\s*=\s*\d+', 'NUMVEHICLEMODELINFOS = 500', content)
            
            # Pedestrians: 130 -> 500
            content = re.sub(r'NUMPEDMODELINFOS\s*=\s*\d+', 'NUMPEDMODELINFOS = 500', content)
            
            # 2D Effects (Lights/Particles): 1600 -> 10000
            content = re.sub(r'NUM2DEFFECTSMODELINFOS\s*=\s*\d+', 'NUM2DEFFECTSMODELINFOS = 10000', content)

            with open(filepath, 'w', encoding='utf-8') as f:
                f.write(content)
            print(f"SUCCESS: Patched limits in {filepath}")

        # Apply to the Master Header File
        patch_limits('src/modelinfo/ModelInfo.h')

    - name: Apply Previous Fixes (Channels & Directory)
      shell: python
      run: |
        import os
        import re

        def replace_text(filepath, pattern, replacement):
            if not os.path.exists(filepath): return
            with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                content = f.read()
            new_content = re.sub(pattern, replacement, content, flags=re.MULTILINE)
            with open(filepath, 'w', encoding='utf-8') as f:
                f.write(new_content)

        def prepend_text(filepath, text):
            if not os.path.exists(filepath): return
            with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                content = f.read()
            with open(filepath, 'w', encoding='utf-8') as f:
                f.write(text + "\n" + content)

        # --- FIX 2: FORCE 64 CHANNELS ---
        prepend_text('src/core/CdStream.h', '#undef MAX_CD_CHANNELS\n#define MAX_CD_CHANNELS 64')
        prepend_text('src/core/CdStream_posix.cpp', '#undef MAX_CD_CHANNELS\n#define MAX_CD_CHANNELS 64')

        # --- FIX 3: DIRECTORY LIMIT (200,000) ---
        replace_text('src/core/Directory.cpp', 
                     r'entries = new DirectoryInfo\[maxEntries\];', 
                     'if (maxEntries < 200000) maxEntries = 200000; entries = new DirectoryInfo[maxEntries];')

        # --- FIX 4: VEHICLE LIMITS (Enums) ---
        replace_text('src/vehicles/HandlingMgr.h', r'\bNUMHANDLINGS\b', 'NUMHANDLINGS_ORIGINAL')
        replace_text('src/vehicles/HandlingMgr.h', r'\bNUMBIKEHANDLINGS\b', 'NUMBIKEHANDLINGS_ORIGINAL')
        replace_text('src/vehicles/HandlingMgr.h', r'\bNUMFLYINGHANDLINGS\b', 'NUMFLYINGHANDLINGS_ORIGINAL')
        replace_text('src/vehicles/HandlingMgr.h', r'\bNUMBOATHANDLINGS\b', 'NUMBOATHANDLINGS_ORIGINAL')
        
        prepend_text('src/vehicles/HandlingMgr.h', '#define NUMHANDLINGS 500\n#define NUMBIKEHANDLINGS 13\n#define NUMFLYINGHANDLINGS 4\n#define NUMBOATHANDLINGS 5')

    - name: Apply Linux System Headers
      run: |
        sed -i '1i #include <semaphore.h>\n#include <fcntl.h>\n#include <stdio.h>\n#define RE3_SEM_OPEN(fmt, ...) ({ char buf[128]; snprintf(buf, 128, fmt, ##__VA_ARGS__); sem_open(buf, O_CREAT, 0644, 0); })\n#define RE3_SEM_CLOSE(sem, ...) { sem_close(sem); char buf[128]; snprintf(buf, 128, __VA_ARGS__); sem_unlink(buf); }' src/core/CdStream_posix.cpp
        sed -i '1i #include <cstring>' src/skel/glfw/glfw.cpp
        sed -i 's/ControlsManager.m_NewState.buttons = (uint8\*)buttons;/memcpy(ControlsManager.m_NewState.buttons, buttons, sizeof(ControlsManager.m_NewState.buttons));/' src/skel/glfw/glfw.cpp

    - name: Compile Linux (Release)
      run: |
        mkdir build
        cd build
        # -DNDEBUG stops the crash messages, but now we have fixed the CAUSE of the crash too.
        cmake -DGTAVC=ON -DLIBRW_PLATFORM=GL3 -DGL3_GFXLIB=GLFW -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-DNDEBUG" ..
        make -j4

    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: reVC-Linux-Deluxe
        path: build/src/reVC
