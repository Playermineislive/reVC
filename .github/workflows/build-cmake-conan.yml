name: Build reVC (Linux + Windows Deluxe)

on:
  workflow_dispatch:      # Adds the "Run Workflow" button
  push:
    branches: [ miami ]   # Runs automatically

jobs:
  # --- JOB 1: LINUX DELUXE (Standard) ---
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Install Linux Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libopenal-dev libsndfile1-dev libmpg123-dev libglfw3-dev

    - name: Apply Linux Deluxe Fixes
      run: |
        # 1. Semaphore Fix (Specific to Linux)
        sed -i '1i #include <semaphore.h>\n#include <fcntl.h>\n#include <stdio.h>\n#define RE3_SEM_OPEN(fmt, ...) ({ char buf[128]; snprintf(buf, 128, fmt, ##__VA_ARGS__); sem_open(buf, O_CREAT, 0644, 0); })\n#define RE3_SEM_CLOSE(sem, ...) { sem_close(sem); char buf[128]; snprintf(buf, 128, __VA_ARGS__); sem_unlink(buf); }' src/core/CdStream_posix.cpp

        # 2. GLFW Controller Fix (Specific to Linux)
        sed -i '1i #include <cstring>' src/skel/glfw/glfw.cpp
        sed -i 's/ControlsManager.m_NewState.buttons = (uint8\*)buttons;/memcpy(ControlsManager.m_NewState.buttons, buttons, sizeof(ControlsManager.m_NewState.buttons));/' src/skel/glfw/glfw.cpp

        # 3. Rename Conflicting Enums
        sed -i 's/\bNUMHANDLINGS\b/NUMHANDLINGS_OLD/g' src/vehicles/HandlingMgr.h
        sed -i 's/\bNUMBIKEHANDLINGS\b/NUMBIKEHANDLINGS_OLD/g' src/vehicles/HandlingMgr.h
        sed -i 's/\bNUMFLYINGHANDLINGS\b/NUMFLYINGHANDLINGS_OLD/g' src/vehicles/HandlingMgr.h
        sed -i 's/\bNUMBOATHANDLINGS\b/NUMBOATHANDLINGS_OLD/g' src/vehicles/HandlingMgr.h
        
        # 4. Inject DELUXE Limits (500 Cars, 5000 Lights)
        sed -i '1i #define NUMHANDLINGS 500' src/vehicles/HandlingMgr.h
        sed -i '1i #define NUMBIKEHANDLINGS 13' src/vehicles/HandlingMgr.h
        sed -i '1i #define NUMFLYINGHANDLINGS 4' src/vehicles/HandlingMgr.h
        sed -i '1i #define NUMBOATHANDLINGS 5' src/vehicles/HandlingMgr.h

        # 5. Fix Lights & Directory Limits
        grep -rl "TIMEMODELSIZE" src/ | xargs sed -i 's/385/5000/g'
        sed -i 's/entries = new DirectoryInfo\[maxEntries\];/if (maxEntries < 50000) maxEntries = 50000; entries = new DirectoryInfo[maxEntries];/' src/core/Directory.cpp

    - name: Compile Linux
      run: |
        mkdir build
        cd build
        cmake -DGTAVC=ON -DLIBRW_PLATFORM=GL3 -DGL3_GFXLIB=GLFW -DCMAKE_BUILD_TYPE=Release ..
        make -j4

    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: reVC-Linux-Deluxe
        path: build/src/reVC

  # --- JOB 2: WINDOWS DELUXE (With OpenAL Fix) ---
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Apply Windows Deluxe Fixes
      shell: bash
      run: |
        # 1. Rename Conflicting Enums
        sed -i 's/\bNUMHANDLINGS\b/NUMHANDLINGS_OLD/g' src/vehicles/HandlingMgr.h
        sed -i 's/\bNUMBIKEHANDLINGS\b/NUMBIKEHANDLINGS_OLD/g' src/vehicles/HandlingMgr.h
        sed -i 's/\bNUMFLYINGHANDLINGS\b/NUMFLYINGHANDLINGS_OLD/g' src/vehicles/HandlingMgr.h
        sed -i 's/\bNUMBOATHANDLINGS\b/NUMBOATHANDLINGS_OLD/g' src/vehicles/HandlingMgr.h
        
        # 2. Inject DELUXE Limits (500 Cars, 5000 Lights)
        sed -i '1i #define NUMHANDLINGS 500' src/vehicles/HandlingMgr.h
        sed -i '1i #define NUMBIKEHANDLINGS 13' src/vehicles/HandlingMgr.h
        sed -i '1i #define NUMFLYINGHANDLINGS 4' src/vehicles/HandlingMgr.h
        sed -i '1i #define NUMBOATHANDLINGS 5' src/vehicles/HandlingMgr.h

        # 3. Fix Lights & Directory Limits
        grep -rl "TIMEMODELSIZE" src/ | xargs sed -i 's/385/5000/g'
        sed -i 's/entries = new DirectoryInfo\[maxEntries\];/if (maxEntries < 50000) maxEntries = 50000; entries = new DirectoryInfo[maxEntries];/' src/core/Directory.cpp

    # --- NEW STEP: Install OpenAL for Windows ---
    - name: Install OpenAL (Windows)
      shell: powershell
      run: |
        Invoke-WebRequest -Uri "https://openal-soft.org/openal-binaries/openal-soft-1.23.1-bin.zip" -OutFile "openal.zip"
        Expand-Archive openal.zip -DestinationPath .
        Move-Item -Path "openal-soft-1.23.1-bin" -Destination "openal"

    - name: Configure CMake (Windows)
      # We tell CMake exactly where the OpenAL library is
      run: |
        mkdir build
        cd build
        cmake -DGTAVC=ON -DLIBRW_PLATFORM=D3D9 -DCMAKE_BUILD_TYPE=Release -A Win32 -DOPENAL_INCLUDE_DIR="..\openal\include" -DOPENAL_LIBRARY="..\openal\libs\Win32\libOpenAL32.dll.a" ..

    - name: Compile Windows
      run: |
        cmake --build build --config Release --parallel 4

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: reVC-Windows-Deluxe
        path: build/src/Release/reVC.exe
        
