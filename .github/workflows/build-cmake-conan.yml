name: Build reVC (Linux Deluxe - Final Logic)

on:
  workflow_dispatch:
  push:
    branches: [ miami ]

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libopenal-dev libsndfile1-dev libmpg123-dev libglfw3-dev

    - name: Apply Logic-Correct Fixes
      shell: python
      run: |
        import os
        import re

        def replace_text(filepath, pattern, replacement):
            if not os.path.exists(filepath): return
            with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                content = f.read()
            # We use Regex to ensure we only replace exact words
            new_content = re.sub(pattern, replacement, content, flags=re.MULTILINE)
            with open(filepath, 'w', encoding='utf-8') as f:
                f.write(new_content)

        def prepend_text(filepath, text):
            if not os.path.exists(filepath): return
            with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                content = f.read()
            with open(filepath, 'w', encoding='utf-8') as f:
                f.write(text + "\n" + content)

        # --- STEP 1: RENAME THE OLD ENUMS (Avoid Conflict) ---
        # We rename the existing identifiers inside the files FIRST.
        # This turns "NUMHANDLINGS" inside the enum into "NUMHANDLINGS_ORIGINAL"
        handling_file = 'src/vehicles/HandlingMgr.h'
        replace_text(handling_file, r'\bNUMHANDLINGS\b', 'NUMHANDLINGS_ORIGINAL')
        replace_text(handling_file, r'\bNUMBIKEHANDLINGS\b', 'NUMBIKEHANDLINGS_ORIGINAL')
        replace_text(handling_file, r'\bNUMFLYINGHANDLINGS\b', 'NUMFLYINGHANDLINGS_ORIGINAL')
        replace_text(handling_file, r'\bNUMBOATHANDLINGS\b', 'NUMBOATHANDLINGS_ORIGINAL')

        # --- STEP 2: DEFINE THE NEW LIMITS ---
        # NOW we add the macros. Since we already renamed the old ones, these are fresh!
        # Code asking for "NUMHANDLINGS" will now see "500".
        prepend_text(handling_file, """
        #define NUMHANDLINGS 500
        #define NUMBIKEHANDLINGS 13
        #define NUMFLYINGHANDLINGS 4
        #define NUMBOATHANDLINGS 5
        """)

        # --- STEP 3: FORCE 64 CHANNELS (The Crash Fix) ---
        # We force the channel limit to 64 at the top of the Stream files
        prepend_text('src/core/CdStream.h', '#undef MAX_CD_CHANNELS\n#define MAX_CD_CHANNELS 64')
        prepend_text('src/core/CdStream_posix.cpp', '#undef MAX_CD_CHANNELS\n#define MAX_CD_CHANNELS 64')

        # --- STEP 4: MUTE ALL CRASHES ---
        # We replace assertions with empty comments
        replace_text('src/core/CdStream_posix.cpp', r'^\s*assert\(.*$', '// assert removed')

        # --- STEP 5: DIRECTORY LIMIT (200,000) ---
        replace_text('src/core/Directory.cpp', 
                     r'entries = new DirectoryInfo\[maxEntries\];', 
                     'if (maxEntries < 200000) maxEntries = 200000; entries = new DirectoryInfo[maxEntries];')

        # --- STEP 6: LIGHTS LIMIT ---
        replace_text('src/modelinfo/TimeModelInfo.h', '385', '5000')
        replace_text('src/modelinfo/TimeModelInfo.cpp', '385', '5000')

    - name: Apply Linux System Headers
      run: |
        # Standard Linux Fixes
        sed -i '1i #include <semaphore.h>\n#include <fcntl.h>\n#include <stdio.h>\n#define RE3_SEM_OPEN(fmt, ...) ({ char buf[128]; snprintf(buf, 128, fmt, ##__VA_ARGS__); sem_open(buf, O_CREAT, 0644, 0); })\n#define RE3_SEM_CLOSE(sem, ...) { sem_close(sem); char buf[128]; snprintf(buf, 128, __VA_ARGS__); sem_unlink(buf); }' src/core/CdStream_posix.cpp
        sed -i '1i #include <cstring>' src/skel/glfw/glfw.cpp
        sed -i 's/ControlsManager.m_NewState.buttons = (uint8\*)buttons;/memcpy(ControlsManager.m_NewState.buttons, buttons, sizeof(ControlsManager.m_NewState.buttons));/' src/skel/glfw/glfw.cpp

    - name: Compile Linux (Release)
      run: |
        mkdir build
        cd build
        cmake -DGTAVC=ON -DLIBRW_PLATFORM=GL3 -DGL3_GFXLIB=GLFW -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-DNDEBUG" ..
        make -j4

    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: reVC-Linux-Deluxe
        path: build/src/reVC
